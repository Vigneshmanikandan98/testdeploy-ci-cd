name: Deploy Allocator

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

# One deploy at a time. A new push waits in line instead of cancelling a deploy
# halfway (a cancelled run leaves Azure mid-update and locks the next run).
concurrency:
  group: deploy-main
  cancel-in-progress: false

env:
  ACR: ${{ vars.ACR_NAME }}
  APP: ${{ vars.CONTAINER_APP_NAME }}
  RG: ${{ vars.RESOURCE_GROUP }}
  IMAGE: ${{ vars.ACR_NAME }}.azurecr.io/allocator:${{ github.sha }}

jobs:
  # CD only ships code that passes CI. Same checks as pull requests, run on the merged code.
  ci:
    uses: ./.github/workflows/ci-new.yml

  deploy:
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 20          # hard stop: no more silent 15-minute runs

    steps:
      - uses: actions/checkout@v4

      - name: Log in to Azure (OIDC, no passwords)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Log in to container registry
        run: az acr login -n $ACR

      # Buildx + cache: unchanged layers (npm install, pip install) are reused,
      # so repeat builds take about a minute instead of several.
      - uses: docker/setup-buildx-action@v3

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Check the Container App exists
        id: check
        run: |
          if az containerapp show -n $APP -g $RG -o none 2>/dev/null; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "::warning::Image pushed ($IMAGE), but Container App '$APP' doesn't exist yet. Create it once (README step 3e), then re-run this workflow."
          fi

      # Only the image changes on each deploy. Port and registry are set once when
      # the app is created, so no deploy ever creates a half-configured revision.
      - name: Deploy new image
        if: steps.check.outputs.exists == 'true'
        timeout-minutes: 8
        run: |
          az containerapp update -n $APP -g $RG \
            --image $IMAGE \
            --set-env-vars APP_VERSION=${{ github.sha }} \
            -o none

      - name: Smoke test /health
        if: steps.check.outputs.exists == 'true'
        timeout-minutes: 3
        run: |
          URL=$(az containerapp show -n $APP -g $RG --query properties.configuration.ingress.fqdn -o tsv)
          for i in $(seq 1 12); do
            if curl -fsS "https://$URL/health"; then echo; echo "Live at https://$URL"; exit 0; fi
            echo "Not healthy yet ($i/12), retrying in 10s..."
            sleep 10
          done
          echo "::error::App did not report healthy at https://$URL/health"
          exit 1

      # Runs only when something failed: prints why, instead of a silent spinner.
      - name: Diagnostics
        if: failure() && steps.check.outputs.exists == 'true'
        run: |
          az containerapp revision list -n $APP -g $RG \
            --query "[].{revision:name, active:properties.active, health:properties.healthState, state:properties.runningState}" -o table
          az containerapp logs show -n $APP -g $RG --type system --tail 30 || true
